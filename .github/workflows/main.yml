name: Cloudflare Tunnel RDP

on:
  workflow_dispatch:

jobs:
  setup-rdp:
    runs-on: windows-arm64
    steps:
      - name: Enable Remote Desktop
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:SystemCurrentControlSetControlTerminal Server' -name "fDenyTSConnections" -value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin"[web:21]

      - name: Install cloudflared with winget
        shell: powershell
        run: |
          winget import -i https://winstall.app/winget-installer/Cloudflare.cloudflared
          # Or directly:
          winget install --id Cloudflare.cloudflared --accept-package-agreements --accept-source-agreements --silent[web:28][web:35]

      - name: Install tunnel service
        shell: powershell
        run: |
          cloudflared service install eyJhIjoiODhjOGE0NDRkMzhiODgwYTExNGYzZGZlZWVlY2ZmMmMiLCJ0IjoiZGEwMjRlNGQtMTBkZi00Y2I0LWE0MTMtZTA5M2VkZTVkZmEzIiwicyI6Ik16azBOMk01TW1NdE1USTJZaTAwTm1JM0xXSTNaV0l0TUdVMk1UaGpNbVExWXpBNCJ9[web:30]

      - name: Start service and verify
        shell: powershell
        run: |
          Start-Service Cloudflared
          Start-Sleep 15
          Get-Service Cloudflared
          cloudflared tunnel list[web:34]

      - name: Connection Instructions
        shell: powershell
        run: |
          Write-Output "Tunnel active. In Cloudflare Zero Trust:"
          Write-Output "1. Networks > Tunnels > Select your tunnel"
          Write-Output "2. Public Hostname > Add: Type=rdp, Service=localhost:3389"
          Write-Output "3. Connect RDP to your-subdomain.yourdomain.com"
          Write-Output "Username: runneradmin (password may not be set)"
          cloudflared tunnel info[web:14]

      - name: Keep alive
        timeout-minutes: 360
        run: Start-Sleep -Seconds 1285000
