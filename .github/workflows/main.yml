name: Cloudflare Tunnel RDP

on:
  workflow_dispatch:

jobs:
  setup-rdp:
    runs-on: windows-latest
    steps:
      - name: Enable Remote Desktop and Firewall
        shell: powershell
        run: |
          # Enable RDP service
          Set-ItemProperty -Path 'HKLM:SystemCurrentControlSetControlTerminal Server' -name "fDenyTSConnections" -value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          # Optional: Add runneradmin to RDP users if needed
          net localgroup "Remote Desktop Users" runneradmin /add

      - name: Checkout repo (optional)
        uses: actions/checkout@v4

      - name: Setup cloudflared
        uses: AnimMouse/setup-cloudflared@v2[web:10]

      - name: Install cloudflared tunnel service
        shell: powershell
        run: |
          cloudflared service install eyJhIjoiODhjOGE0NDRkMzhiODgwYTExNGYzZGZlZWVlY2ZmMmMiLCJ0IjoiZGEwMjRlNGQtMTBkZi00Y2I0LWE0MTMtZTA5M2VkZTVkZmEzIiwicyI6Ik16azBOMk01TW1NdE1USTJZaTAwTm1JM0xXSTNaV0l0TUdVMk1UaGpNbVExWXpBNCJ9[web:27]

      - name: Start cloudflared service
        shell: powershell
        run: |
          Start-Service Cloudflared
          Start-Sleep 10
          Get-Service Cloudflared
          cloudflared tunnel list

      - name: Display tunnel connection info
        shell: powershell
        run: |
          Write-Output "Tunnel installed. Configure public hostname in Cloudflare Zero Trust dashboard:"
          Write-Output "1. Go to https://dash.cloudflare.com -> Zero Trust -> Networks -> Tunnels"
          Write-Output "2. Find your tunnel (UUID from token)"
          Write-Output "3. Add Public Hostname: Type=rdp, URL=localhost:3389, Subdomain=your-rdp.example.com"
          Write-Output "Connect via RDP client to your-rdp.example.com"
          cloudflared tunnel info

      - name: Keep session alive
        timeout-minutes: 360
        run: Start-Sleep -Seconds ((360*60)-60)
